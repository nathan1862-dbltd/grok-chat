services:
  - type: web
    name: grok-php
    env: docker
    repo: https://github.com/365cent/grok-chat
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.3
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_GATEWAY_ID
        value: default
    autoDeploy: true
    plan: free
